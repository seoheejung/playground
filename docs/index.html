<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <title>SEOHJ | Portfolio Projects</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <div id="projectList" class="pdf-list"></div>
</header>

<main>

    <div class="viewer">

        <button id="prevBtn" class="nav-btn left">❮</button>
        <button id="nextBtn" class="nav-btn right">❯</button>

        <div class="viewer-header">

            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>

            <div id="viewerTitle" class="viewer-title"></div>

            <div class="zoom-controls">
                <button id="zoomOut">−</button>
                <button id="zoomIn">+</button>
            </div>

        </div>

        <div id="slider"></div>

        <div id="pageIndicator" class="page-indicator"></div>

    </div>

</main>

<script src="app.js"></script>

</body>
</html>
