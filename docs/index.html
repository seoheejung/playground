<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <title>Portfolio Projects</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <div id="projectList" class="pdf-list"></div>
</header>

<main>

    <button id="prevBtn" class="nav-btn left">❮</button>

    <div class="viewer">

        <div class="viewer-header">

            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>

            <div id="viewerTitle" class="viewer-title"></div>

        </div>

        <div id="slider"></div>

        <div id="pageIndicator" class="page-indicator"></div>

    </div>

    <button id="nextBtn" class="nav-btn right">❯</button>

</main>

<script src="app.js"></script>

</body>
</html>
